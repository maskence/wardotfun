# Place proxy_cache_path and map in nginx's http {} block.
proxy_cache_path /var/cache/nginx/wardotfun-tiles levels=1:2
                 keys_zone=wardotfun_tiles:64m max_size=10g inactive=30d
                 use_temp_path=off;

map $http_accept_encoding $wardotfun_encoding {
    default "";
    ~*gzip gzip;
}

# Merge these locations into the existing tache.niglo.fun/wardotfun server.
location ~ ^/api/map-tiles/.+\.pbf$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_cache wardotfun_tiles;
    proxy_cache_key "$scheme$request_method$host$request_uri:$wardotfun_encoding";
    proxy_cache_valid 200 365d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Map-Tile-Cache $upstream_cache_status always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_types application/json application/geo+json application/vnd.mapbox-vector-tile application/x-protobuf;
}
